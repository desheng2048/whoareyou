<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>亲戚计算器 · 理清家族关系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F4F7;
    --white: #FFFFFF;
    --text: #2D2A2E;
    --text-soft: #6B5D68;
    --text-mute: #B8A8B3;
    --accent: #C17D92;
    --accent-light: #F2E4EA;
    --accent-warm: #C8676E;
    --accent-warm-light: #FBE8E6;
    --surface: #FFFFFF;
    --shadow-sm: 0 1px 3px rgba(100,80,90,0.06);
    --shadow-md: 0 4px 14px rgba(100,80,90,0.10);
    --shadow-lg: 0 8px 28px rgba(100,80,90,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F4EFF3;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app {
    max-width: 500px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    padding-top: calc(40px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 34px;
  }
  .header h1 {
    font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
    font-size: 28px;
    font-weight: 900;
    color: #3D2E35;
    letter-spacing: 1px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-mute);
    margin-top: 6px;
    font-weight: 400;
  }

  /* ========== DISPLAY CARD ========== */
  .display {
    background: var(--surface);
    border-radius: 24px;
    padding: 32px 24px;
    margin-bottom: 28px;
    min-height: 180px;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .display-chain {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 14px;
    min-height: 22px;
    word-break: keep-all;
    font-weight: 500;
  }
  .display-chain .chip {
    display: inline-block;
    padding: 4px 12px;
    margin: 0 2px;
    background: #F5EFF3;
    border-radius: 14px;
    color: #5D4A55;
    font-weight: 600;
    font-size: 12px;
  }
  .display-result {
    font-size: 44px;
    font-weight: 800;
    color: #C17D92;
    line-height: 1.2;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .display-result:empty::before {
    content: '？';
    color: var(--text-mute);
    font-weight: 300;
  }
  .display-note {
    font-size: 12px;
    color: var(--text-mute);
    margin-top: 4px;
  }
  .display-tags {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-top: 14px;
  }
  .display-tag {
    padding: 5px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    background: var(--accent-light);
    color: #A05D72;
  }

  /* ========== BUTTON GRID ========== */
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }

  .btn {
    padding: 18px 10px;
    border-radius: 18px;
    border: none;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 家庭成员按钮 — 薰衣草色 */
  .btn.family {
    background: #ECE3F0;
    color: #5D4770;
    box-shadow: 0 2px 0 #D8CAE2, var(--shadow-sm);
  }
  .btn.family:hover {
    background: #F2EBF5;
    box-shadow: 0 3px 0 #D8CAE2, var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn.family:active {
    background: #E0D4E8;
    box-shadow: 0 1px 0 #C8B5D5;
    transform: translateY(1px);
  }

  /* 配偶按钮 — 暖粉色 */
  .btn.relation {
    background: #FAEAEE;
    color: #A55565;
    box-shadow: 0 2px 0 #F0D0D8, var(--shadow-sm);
  }
  .btn.relation:hover {
    background: #FDF2F4;
    box-shadow: 0 3px 0 #F0D0D8, var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn.relation:active {
    background: #F5DCE3;
    box-shadow: 0 1px 0 #E5C0CA;
    transform: translateY(1px);
  }

  /* 撤销按钮 — 中性灰 */
  .btn.action {
    background: #EFECF0;
    color: #8A7E88;
    font-size: 18px;
    box-shadow: 0 2px 0 #DDD7E0, var(--shadow-sm);
  }
  .btn.action:hover {
    background: #F5F3F6;
    box-shadow: 0 3px 0 #DDD7E0, var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn.action:active {
    background: #E5DFE8;
    box-shadow: 0 1px 0 #CEC5D5;
    transform: translateY(1px);
  }

  /* AC 按钮 — 暖珊瑚色 */
  .btn.accent {
    background: #FBE4E2;
    color: #C5565C;
    box-shadow: 0 2px 0 #F2C8C6, var(--shadow-sm);
  }
  .btn.accent:hover {
    background: #FDEDEB;
    box-shadow: 0 3px 0 #F2C8C6, var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn.accent:active {
    background: #F7D5D2;
    box-shadow: 0 1px 0 #E8B5B2;
    transform: translateY(1px);
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(50, 42, 48, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: white;
    padding: 11px 22px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    z-index: 1000;
    font-family: 'Noto Sans SC', sans-serif;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
               toastOut 0.35s ease 1.6s forwards;
    pointer-events: none;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.9); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; }
    to   { opacity: 0; transform: translateX(-50%) translateY(-6px); }
  }

  /* ========== RESPONSIVE ========== */

  /* iPhone SE / 小屏 (≤ 374px) */
  @media (max-width: 374px) {
    .app { padding: 28px 12px 60px; padding-top: calc(28px + env(safe-area-inset-top, 0px)); padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
    .btn-grid { gap: 10px; }
    .btn { font-size: 17px; padding: 15px 6px; border-radius: 14px; }
    .display { padding: 24px 16px; min-height: 150px; border-radius: 20px; }
    .display-result { font-size: 34px; }
    .header h1 { font-size: 22px; }
    .header { margin-bottom: 24px; }
  }

  /* iPhone 12 / 13 / 14 标准 (375-393px) */
  @media (min-width: 375px) and (max-width: 393px) {
    .app { padding: 34px 18px 68px; padding-top: calc(34px + env(safe-area-inset-top, 0px)); padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
    .btn-grid { gap: 12px; }
    .btn { font-size: 19px; padding: 16px 8px; border-radius: 16px; }
    .display-result { font-size: 38px; }
    .header h1 { font-size: 24px; }
  }

  /* iPhone 14 Pro Max / 15 Pro Max (414-430px, 高屏) */
  @media (min-width: 414px) and (max-width: 430px) {
    .app {
      max-width: 430px;
      padding: 44px 22px 90px;
      padding-top: calc(44px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    }
    .btn-grid { gap: 16px; }
    .btn {
      font-size: 21px;
      padding: 20px 12px;
      border-radius: 18px;
    }
    .btn.action { font-size: 19px; }
    .display {
      padding: 34px 24px;
      min-height: 185px;
      border-radius: 26px;
      margin-bottom: 32px;
    }
    .display-result { font-size: 46px; }
    .display-chain { font-size: 14px; }
    .display-chain .chip { font-size: 13px; padding: 5px 13px; }
    .header h1 { font-size: 28px; }
    .header p { font-size: 13px; }
    .header { margin-bottom: 36px; }
  }

  /* iPad / 平板 (≥ 600px) */
  @media (min-width: 600px) {
    .app {
      max-width: 560px;
      padding: 56px 32px 100px;
      padding-top: calc(56px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    }
    .btn-grid { gap: 18px; }
    .btn {
      font-size: 24px;
      padding: 22px 14px;
      border-radius: 20px;
    }
    .btn.action { font-size: 20px; }
    .display {
      padding: 40px 32px;
      min-height: 200px;
      border-radius: 28px;
      margin-bottom: 34px;
    }
    .display-result { font-size: 52px; }
    .display-chain { font-size: 14px; }
    .display-chain .chip { font-size: 13px; padding: 5px 14px; }
    .header h1 { font-size: 32px; }
    .header p { font-size: 14px; }
    .header { margin-bottom: 40px; }
  }

  /* iPad Pro / 大屏 (≥ 900px) */
  @media (min-width: 900px) {
    .app {
      max-width: 620px;
      padding: 64px 40px 120px;
      padding-top: calc(64px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
    }
    .btn-grid { gap: 22px; }
    .btn {
      font-size: 26px;
      padding: 26px 16px;
      border-radius: 22px;
    }
    .btn.action { font-size: 22px; }
    .display-result { font-size: 58px; }
    .header h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>亲戚计算器</h1>
    <p>点出关系链，自动算称呼</p>
  </div>

  <div class="display" id="display">
    <div class="display-chain" id="displayChain"></div>
    <div class="display-result" id="displayResult"></div>
    <div class="display-note" id="displayNote"></div>
    <div class="display-tags" id="displayTags"></div>
  </div>

  <div class="btn-grid">
    <button class="btn relation" onclick="addStep('h')">夫</button>
    <button class="btn relation" onclick="addStep('w')">妻</button>
    <button class="btn action" onclick="undoStep()" title="撤销">⌫</button>
    <button class="btn accent" onclick="clearSteps()" title="全部清空">AC</button>

    <button class="btn family" onclick="addStep('f')">父</button>
    <button class="btn family" onclick="addStep('m')">母</button>
    <button class="btn family" onclick="addStep('ob')">兄</button>
    <button class="btn family" onclick="addStep('lb')">弟</button>

    <button class="btn family" onclick="addStep('os')">姐</button>
    <button class="btn family" onclick="addStep('ls')">妹</button>
    <button class="btn family" onclick="addStep('s')">子</button>
    <button class="btn family" onclick="addStep('d')">女</button>
  </div>
</div>

<script>
// ==================== 关系数据库 ====================

// gen: 正值=长辈, 0=同辈, 负值=晚辈
// side: 'p'=父系, 'm'=母系, 'b'=both
const DB = {};

function d(title, gen, note, maleOnly) { return {title,gen,note:note||'',maleOnly:!!maleOnly}; }

// -- 核心（自己、配偶、直系） --
DB[''] = d('自己', 0);
DB['h'] = d('丈夫', 0, '', true);
DB['w'] = d('妻子', 0);

// -- 1 代直系 --
DB['f'] = d('父亲', 1);
DB['m'] = d('母亲', 1);
DB['s'] = d('儿子', -1);
DB['d'] = d('女儿', -1);

// -- 2 代直系 --
DB['f,f'] = d('祖父', 2);   DB['f,m'] = d('祖母', 2);
DB['m,f'] = d('外祖父', 2);  DB['m,m'] = d('外祖母', 2);
DB['s,s'] = d('孙子', -2);   DB['s,d'] = d('孙女', -2);
DB['d,s'] = d('外孙', -2);   DB['d,d'] = d('外孙女', -2);

// -- 3 代直系 --
(function(){
  var a=['f','m'], b=['f','m'], c=['f','m'];
  var pre={'f,f':'曾','f,m':'曾','m,f':'外曾','m,m':'外曾'};
  var suf={'f':'祖父','m':'祖母'};
  a.forEach(function(x){
    b.forEach(function(y){
      c.forEach(function(z){
        DB[x+','+y+','+z]=d(pre[x+','+y]+suf[z],3);
      });
    });
  });
  var a2=['s','d'], b2=['s','d'], c2=['s','d'];
  var pre2={'s,s':'曾','s,d':'曾','d,s':'曾外','d,d':'曾外'};
  var suf2={'s':'孙','d':'孙女'};
  a2.forEach(function(x){
    b2.forEach(function(y){
      c2.forEach(function(z){
        DB[x+','+y+','+z]=d(pre2[x+','+y]+suf2[z],-3);
      });
    });
  });
})();

// -- 4 代直系 --
(function(){
  var b4=['f,f,f,f','f,f,f,m','f,f,m,f','f,f,m,m','f,m,f,f','f,m,f,m','f,m,m,f','f,m,m,m',
           'm,f,f,f','m,f,f,m','m,f,m,f','m,f,m,m','m,m,f,f','m,m,f,m','m,m,m,f','m,m,m,m'];
  var t4=['高祖父','高祖母','高外祖父','高外祖母','曾外曾祖父','曾外曾祖母','曾外曾外祖父','曾外曾外祖母',
          '外高祖父','外高祖母','外高外祖父','外高外祖母','外曾外曾祖父','外曾外曾祖母','外曾外曾外祖父','外曾外曾外祖母'];
  for(var i=0;i<b4.length;i++) DB[b4[i]]=d(t4[i],4);
  // 4 代孙
  var s4=['s,s,s,s','s,s,s,d','s,s,d,s','s,s,d,d','s,d,s,s','s,d,s,d','s,d,d,s','s,d,d,d',
          'd,s,s,s','d,s,s,d','d,s,d,s','d,s,d,d','d,d,s,s','d,d,s,d','d,d,d,s','d,d,d,d'];
  var st4=['玄孙','玄孙女','玄外孙','玄外孙女','曾外玄孙','曾外玄孙女','曾外玄外孙','曾外玄外孙女',
           '外玄孙','外玄孙女','外玄外孙','外玄外孙女','外曾外玄孙','外曾外玄孙女','外曾外玄外孙','外曾外玄外孙女'];
  for(var i=0;i<s4.length;i++) DB[s4[i]]=d(st4[i],-4);
})();

// -- 5-6 代直系（递归生成，避免 key 冲突） --
(function(){
  // 生成所有 n-code 的 f/m 组合（直系祖先）
  function genUpCombos(n) {
    var result = [];
    function dfs(current, depth) {
      if (depth === n) { result.push(current.slice()); return; }
      dfs(current.concat('f'), depth + 1);
      dfs(current.concat('m'), depth + 1);
    }
    dfs([], 0);
    return result;
  }

  // 简化命名：纯父系→天/烈，中途有母系→加"外"前缀
  function upTitle(codes, gen) {
    var hasM = false;
    // 最后一位是性别指示(父/母)，检查前面是否有母系
    for (var i = 0; i < codes.length - 1; i++) {
      if (codes[i] === 'm') { hasM = true; break; }
    }
    var prefix = gen === 5 ? '天' : '烈';
    if (hasM) prefix = '外' + prefix;
    return prefix + (codes[codes.length - 1] === 'f' ? '祖父' : '祖母');
  }

  // 生成 all-s/d 组合（直系子孙）
  function genDnCombos(n) {
    var result = [];
    function dfs(current, depth) {
      if (depth === n) { result.push(current.slice()); return; }
      dfs(current.concat('s'), depth + 1);
      dfs(current.concat('d'), depth + 1);
    }
    dfs([], 0);
    return result;
  }

  function dnTitle(codes, gen) {
    var hasD = false;
    for (var i = 0; i < codes.length - 1; i++) {
      if (codes[i] === 'd') { hasD = true; break; }
    }
    var prefix = gen === -4 ? '玄' : gen === -5 ? '来' : '晜';
    if (hasD) prefix = '外' + prefix;
    return prefix + (codes[codes.length - 1] === 's' ? '孙' : '孙女');
  }

  // Gen 5 ancestors: 5-code keys
  var up5 = genUpCombos(5);
  for (var i = 0; i < up5.length; i++) {
    DB[up5[i].join(',')] = d(upTitle(up5[i], 5), 5);
  }

  // Gen 6 ancestors: 6-code keys
  var up6 = genUpCombos(6);
  for (var i = 0; i < up6.length; i++) {
    DB[up6[i].join(',')] = d(upTitle(up6[i], 6), 6);
  }

  // Gen 5 descendants (gen -5): 5-code keys
  var dn5 = genDnCombos(5);
  for (var i = 0; i < dn5.length; i++) {
    DB[dn5[i].join(',')] = d(dnTitle(dn5[i], -5), -5);
  }

  // Gen 6 descendants (gen -6): 6-code keys
  var dn6 = genDnCombos(6);
  for (var i = 0; i < dn6.length; i++) {
    DB[dn6[i].join(',')] = d(dnTitle(dn6[i], -6), -6);
  }
})();

// -- 兄弟姐妹 --
DB['ob'] = d('哥哥', 0);   DB['lb'] = d('弟弟', 0);
DB['os'] = d('姐姐', 0);   DB['ls'] = d('妹妹', 0);

// -- 父母的兄弟姐妹 --
DB['f,ob'] = d('伯父', 1); DB['f,lb'] = d('叔父', 1);
DB['f,os'] = d('姑母', 1); DB['f,ls'] = d('姑母', 1);
DB['m,ob'] = d('大舅舅', 1); DB['m,lb'] = d('小舅舅', 1);
DB['m,os'] = d('大姨', 1);  DB['m,ls'] = d('小姨', 1);

// -- 兄弟姐妹的子女 --
DB['ob,s'] = d('侄子', -1); DB['ob,d'] = d('侄女', -1);
DB['lb,s'] = d('侄子', -1); DB['lb,d'] = d('侄女', -1);
DB['os,s'] = d('外甥', -1); DB['os,d'] = d('外甥女', -1);
DB['ls,s'] = d('外甥', -1); DB['ls,d'] = d('外甥女', -1);

// -- 祖父母的兄弟姐妹 --
DB['f,f,ob'] = d('伯祖父', 2); DB['f,f,lb'] = d('叔祖父', 2);
DB['f,f,os'] = d('姑祖母', 2); DB['f,f,ls'] = d('姑祖母', 2);
DB['f,m,ob'] = d('舅祖父', 2); DB['f,m,lb'] = d('舅祖父', 2);
DB['f,m,os'] = d('姨祖母', 2); DB['f,m,ls'] = d('姨祖母', 2);
DB['m,f,ob'] = d('外伯祖父', 2); DB['m,f,lb'] = d('外叔祖父', 2);
DB['m,f,os'] = d('外姑祖母', 2); DB['m,f,ls'] = d('外姑祖母', 2);
DB['m,m,ob'] = d('外舅祖父', 2); DB['m,m,lb'] = d('外舅祖父', 2);
DB['m,m,os'] = d('外姨祖母', 2); DB['m,m,ls'] = d('外姨祖母', 2);

// -- 孙辈 --
DB['s,s,s'] = d('曾孙', -3); DB['s,s,d'] = d('曾孙女', -3);
DB['s,d,s'] = d('曾外孙', -3); DB['s,d,d'] = d('曾外孙女', -3);
DB['d,s,s'] = d('外曾孙', -3); DB['d,s,d'] = d('外曾孙女', -3);
DB['d,d,s'] = d('外曾外孙', -3); DB['d,d,d'] = d('外曾外孙女', -3);

// -- 堂/表兄弟姐妹 --
DB['f,ob,s'] = d('堂兄', 0, '父亲兄弟的儿子'); DB['f,ob,d'] = d('堂姐', 0);
DB['f,lb,s'] = d('堂弟', 0); DB['f,lb,d'] = d('堂妹', 0);

// ==================== 引擎核心 ====================

function codesToString(codes) {
  return codes.join(',');
}

// 纯文本查找（用于 parseText）
const TEXT_TO_CODE = {
  '爸':'f','爸爸':'f','父亲':'f','爹':'f',
  '妈':'m','妈妈':'m','母亲':'m','娘':'m',
  '夫':'h','丈夫':'h','老公':'h','先生':'h',
  '妻':'w','妻子':'w','老婆':'w','太太':'w',
  '哥':'ob','哥哥':'ob','兄':'ob',
  '弟':'lb','弟弟':'lb',
  '姐':'os','姐姐':'os',
  '妹':'ls','妹妹':'ls',
  '儿':'s','儿子':'s','子':'s',
  '女':'d','女儿':'d',
  '爷':'f,f','爷爷':'f,f','祖父':'f,f',
  '奶':'f,m','奶奶':'f,m','祖母':'f,m',
  '外公':'m,f','姥爷':'m,f','外祖父':'m,f',
  '外婆':'m,m','姥姥':'m,m','外祖母':'m,m',
};

// 反向查找用的代码到中文映射
const CODE_TO_CH = {
  'h':'丈夫','w':'妻子','f':'父亲','m':'母亲',
  'ob':'哥哥','lb':'弟弟','os':'姐姐','ls':'妹妹',
  's':'儿子','d':'女儿',
};

function parseText(text) {
  // 按"的"分割
  var parts = text.split('的').map(function(p){return p.trim();}).filter(Boolean);
  var codes = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    // 处理 "XX的XX的XX"
    if (TEXT_TO_CODE[p]) {
      codes.push(TEXT_TO_CODE[p]);
    } else {
      // 尝试组合解析：如 "弟弟的" → lb
      var found = false;
      for (var key in TEXT_TO_CODE) {
        if (p.indexOf(key) === 0) {
          codes.push(TEXT_TO_CODE[key]);
          found = true;
          break;
        }
      }
      if (!found) return null; // 无法解析
    }
  }
  return codes;
}

function codesToText(codes) {
  return codes.map(function(c){ return CODE_TO_CH[c] || c; }).join('的');
}

// 在 DB/COMPOUND 中查找最长已知前缀
// 返回 {result: {title,gen,note}, codes: matchedCodes}
function findLongestPrefix(codes) {
  var bestLen = 0, bestResult = null, bestCodes = [];
  for (var len = codes.length; len >= 0; len--) {
    var key = codes.slice(0, len).join(',');
    if (DB[key]) {
      bestLen = len; bestResult = DB[key]; bestCodes = codes.slice(0, len);
      break;
    }
  }
  return {result: bestResult, codes: bestCodes, len: bestLen};
}

// 核心计算函数
function calculate(codes, gender) {
  if (!codes || codes.length === 0) {
    return { title: '自己', gen: 0, note: '', chain: '', tags: [] };
  }

  var chainStr = codesToString(codes);

  // STEP 1: 精确匹配 DB
  if (DB[chainStr]) {
    var r = DB[chainStr];
    if (r.maleOnly && gender !== 'male') {
      return { title: '（仅限男性）', gen: r.gen, note: '此称谓仅适用于男性', chain: chainStr, tags: [] };
    }
    // 堂/表兄弟姐妹年龄歧义：显示兄/弟或姐/妹两种可能
    var COUSIN_VARS = {
      '堂兄':['堂兄','堂弟'],'堂弟':['堂兄','堂弟'],'堂姐':['堂姐','堂妹'],'堂妹':['堂姐','堂妹'],
      '表兄':['表兄','表弟'],'表弟':['表兄','表弟'],'表姐':['表姐','表妹'],'表妹':['表姐','表妹']
    };
    if (COUSIN_VARS[r.title]) {
      var vars = COUSIN_VARS[r.title];
      return { title: vars.join(' / '), gen: r.gen, note: '年龄不同称谓不同，以实际年龄为准', chain: chainStr, tags: vars };
    }
    return { title: r.title, gen: r.gen, note: r.note || '', chain: chainStr, tags: [] };
  }

  // STEP 2: 去除年龄修饰符后重试
  var stripped = codes.filter(function(c){ return c !== '&o' && c !== '&l'; });
  if (stripped.length < codes.length) return calculate(stripped, gender);

  // STEP 3: xb/xs 通配符替换
  var hasWild = codes.indexOf('xb') >= 0 || codes.indexOf('xs') >= 0;
  if (hasWild) {
    var expanded = expandWildcards(codes);
    if (expanded.length > 1) {
      var titles = [];
      for (var i = 0; i < expanded.length; i++) {
        var er = calculate(expanded[i], gender);
        if (er.title && er.title !== '（仅限男性）') titles.push(er.title);
      }
      if (titles.length > 0) {
        var uniqueTitles = [];
        for (var ti = 0; ti < titles.length; ti++) {
          if (uniqueTitles.indexOf(titles[ti]) < 0) uniqueTitles.push(titles[ti]);
        }
        return { title: uniqueTitles.join('/'), gen: calculate(expanded[0], gender).gen, note: '可能存在多种称谓', chain: chainStr, tags: uniqueTitles };
      }
    }
  }

  // STEP 4: 检查表/堂兄弟歧义（仅3步链：父母兄弟姐妹→其子女）
  if (codes.length === 3 && (codes[codes.length-1] === 's' || codes[codes.length-1] === 'd')) {
    var cousinCheck = checkCousinAmbiguity(codes, gender);
    if (cousinCheck) return cousinCheck;
  }

  // STEP 5: ★ 元关系组合（META_COMPOSITION）★
  // 找最长已知前缀 → META_COMPOSE 查下一步 → 递归
  var mcResult = metaCompose(codes, gender, 0);
  if (mcResult) return mcResult;

  // STEP 5.5: 纯祖先/纯子孙链（7代及以上，无上限称谓）
  var pureResult = pureChainTitle(codes);
  if (pureResult) return pureResult;

  // STEP 6: 基于辈分的兜底计算
  return generationFallback(codes, gender);

  return { title: '？', gen: 0, note: '暂时无法计算此关系', chain: chainStr, tags: [] };
}

function expandWildcards(codes) {
  // xb → ob 或 lb（兄或弟）
  // xs → os 或 ls（姐或妹）
  var result = [[]];
  for (var i = 0; i < codes.length; i++) {
    var c = codes[i];
    var next = [];
    if (c === 'xb') {
      for (var j = 0; j < result.length; j++) {
        next.push(result[j].concat(['ob']));
        next.push(result[j].concat(['lb']));
      }
    } else if (c === 'xs') {
      for (var j = 0; j < result.length; j++) {
        next.push(result[j].concat(['os']));
        next.push(result[j].concat(['ls']));
      }
    } else {
      for (var j = 0; j < result.length; j++) {
        next.push(result[j].concat([c]));
      }
    }
    result = next;
  }
  return result;
}

function checkCousinAmbiguity(codes, gender) {
  // 当遇到表中/堂兄弟的歧义（如 f,os,s 可能是表兄或表弟）
  // 仅适用于父母兄弟姐妹的子女，排除配偶方关系
  var prefix = codes.slice(0, -1);
  var prefixKey = prefix.join(',');
  var prefixR = DB[prefixKey];
  if (!prefixR) {
    var lp = findLongestPrefix(prefix);
    if (lp.result) prefixR = lp.result;
  }

  if (!prefixR) return null;
  var t = prefixR.title;

  // 排除配偶方关系和中间态关系
  var spouseTitles = ['大舅子','小舅子','大姨子','小姨子','大伯','小叔','大姑','小姑',
    '内侄','内侄女','内侄孙','内侄孙女','内侄曾孙','内侄曾孙女','姨甥','姨甥女','姨甥孙','姨甥孙女',
    '岳父','岳母','岳伯父','岳叔父','岳姑母','岳舅父','岳姨母',
    '公公','婆婆','伯公公','叔公公','姑婆婆','舅公公','姨婆婆',
    '岳堂兄','岳堂姐'];
  for (var i = 0; i < spouseTitles.length; i++) {
    if (t === spouseTitles[i]) return null;
  }

  // 检查父系还是母系
  var isPatrilineal = prefixKey.indexOf('f,ob,') === 0 || prefixKey.indexOf('f,lb,') === 0 ||
    prefixKey === 'f,ob' || prefixKey === 'f,lb' ||
    prefixKey.indexOf('f,f,ob') === 0 || prefixKey.indexOf('f,f,lb') === 0;
  var isMatrilineal = prefixKey.indexOf('f,os') === 0 || prefixKey.indexOf('f,ls') === 0 ||
    prefixKey.indexOf('m,') === 0;

  if (!isPatrilineal && !isMatrilineal) return null;

  var lastC = codes[codes.length - 1];
  var titles = isPatrilineal
    ? (lastC === 's' ? ['堂兄', '堂弟'] : ['堂姐', '堂妹'])
    : (lastC === 's' ? ['表兄', '表弟'] : ['表姐', '表妹']);

  return {
    title: titles.join('/'),
    gen: 0,
    note: '年龄未知，可能存在多种称谓',
    chain: codesToString(codes),
    tags: titles
  };
}

// ★ 核心：元关系组合
function metaCompose(codes, gender, depth) {
  if (depth > 10) return null; // 防止无穷递归

  // 找最长已知前缀
  var lp = findLongestPrefix(codes);
  if (!lp.result || lp.len === 0) return null;

  var remaining = codes.slice(lp.len);
  if (remaining.length === 0) {
    // 前缀就是全部——直接返回 DB 中的结果
    return formatResult(lp.result, codesToString(codes), [lp.result.title]);
  }

  // 尝试用 META_COMPOSE 将已知前缀扩展一步
  var nextCode = remaining[0];
  var baseTitle = lp.result.title;
  var mcKey = baseTitle + ',' + nextCode;

  if (META_COMPOSE[mcKey]) {
    var mc = META_COMPOSE[mcKey];
    var newResult = { title: mc.title, gen: mc.gen, note: '' };

    if (remaining.length === 1) {
      return formatResult(newResult, codesToString(codes), [newResult.title]);
    }

    // 递归处理剩余的
    var rest = remaining.slice(1);
    // 构造新的"已知前缀"作为递归起点
    var recursiveInput = [mc.title]; // 把新结果作为虚拟的"一步"
    // 但我们需要用实际代码继续递归

    // 更好的做法：用新复合关系的 children
    // 例如：大舅子 + d → 内侄女，然后 内侄女 + s → 内侄孙
    var subResult = metaComposeFromBase(mc.title, rest, gender, depth + 1);
    if (subResult) return subResult;

    return formatResult(newResult, codesToString(codes), [newResult.title]);
  }

  return null;
}

function metaComposeFromBase(baseTitle, remainingCodes, gender, depth) {
  if (remainingCodes.length === 0) {
    // 找 baseTitle 在 DB/COMPOUND 中的信息
    for (var k in DB) {
      if (DB[k].title === baseTitle) return formatResult(DB[k], k, [baseTitle]);
    }
    return { title: baseTitle, gen: 0, note: '', chain: '', tags: [baseTitle] };
  }
  if (depth > 10) return null;

  var nextCode = remainingCodes[0];
  var mcKey = baseTitle + ',' + nextCode;

  if (META_COMPOSE[mcKey]) {
    var mc = META_COMPOSE[mcKey];
    var newTitle = mc.title;
    return metaComposeFromBase(newTitle, remainingCodes.slice(1), gender, depth + 1);
  }

  return null;
}

function formatResult(dbResult, chain, tags) {
  return {
    title: dbResult.title || '',
    gen: dbResult.gen || 0,
    note: dbResult.note || '',
    chain: chain,
    tags: tags || [dbResult.title]
  };
}

// 纯祖先链（全 f/m）或纯子孙链（全 s/d）的称谓（≥7代，DB 静态表未覆盖的部分）
// 命名沿用中国传统辈分序列：太祖(7) 远祖(8) 鼻祖(9) / 仍孙(7) 云孙(8) 耳孙(9)
var GEN_UP_NAME = {7:'太', 8:'远', 9:'鼻'};
var GEN_DN_NAME = {7:'仍', 8:'云', 9:'耳'};

function pureChainTitle(codes) {
  if (codes.length < 7) return null;
  var n = codes.length;
  var allUp = true, allDn = true;
  for (var i = 0; i < n; i++) {
    if (codes[i] !== 'f' && codes[i] !== 'm') allUp = false;
    if (codes[i] !== 's' && codes[i] !== 'd') allDn = false;
  }

  if (allUp) {
    // "外"前缀：末位是性别指示，只检查前面是否有母系
    var hasM = false;
    for (var i = 0; i < n - 1; i++) if (codes[i] === 'm') { hasM = true; break; }
    var prefix = GEN_UP_NAME[n] || (n + '世');
    if (hasM) prefix = '外' + prefix;
    return {
      title: prefix + (codes[n-1] === 'f' ? '祖父' : '祖母'),
      gen: n,
      note: n > 9 ? '第' + n + '代直系祖先' : '',
      chain: codesToString(codes),
      tags: []
    };
  }

  if (allDn) {
    var hasD = false;
    for (var i = 0; i < n - 1; i++) if (codes[i] === 'd') { hasD = true; break; }
    var prefix = GEN_DN_NAME[n] || (n + '世');
    if (hasD) prefix = '外' + prefix;
    return {
      title: prefix + (codes[n-1] === 's' ? '孙' : '孙女'),
      gen: -n,
      note: n > 9 ? '第' + n + '代直系子孙' : '',
      chain: codesToString(codes),
      tags: []
    };
  }

  return null;
}

// 基于辈分的兜底计算
function generationFallback(codes, gender) {
  var gen = 0;
  var chain = codesToString(codes);

  for (var i = 0; i < codes.length; i++) {
    switch (codes[i]) {
      case 'f': case 'm': gen++; break;
      case 's': case 'd': gen--; break;
      default: break; // h,w,ob,lb,os,ls 不改变辈分
    }
  }

  if (gen > 0) {
    var genNames = ['', '父/母', '祖父/母', '曾祖', '高祖', '天祖', '烈祖'];
    var adj = (gen <= 6 && genNames[gen]) ? genNames[gen] : gen + '代';
    return {
      title: adj + '长辈',
      gen: gen,
      note: '辈分推算（具体称谓取决于关系路径）',
      chain: chain,
      tags: []
    };
  } else if (gen < 0) {
    var dGen = -gen;
    var genNamesDn = ['', '子/女', '孙辈', '曾孙', '玄孙', '来孙', '晜孙'];
    var adj = (dGen <= 6 && genNamesDn[dGen]) ? genNamesDn[dGen] : dGen + '代';
    return {
      title: adj + '晚辈',
      gen: gen,
      note: '辈分推算（具体称谓取决于关系路径）',
      chain: chain,
      tags: []
    };
  } else {
    // 同辈
    return {
      title: '同辈亲戚',
      gen: 0,
      note: '具体称谓取决于年龄和关系',
      chain: chain,
      tags: []
    };
  }
}

// ==================== UI 状态与交互 ====================

let currentSteps = [];
var toastTimer = null;

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.remove(); }, 2000);
}

function addStep(code) {
  if (currentSteps.length >= 12) {
    toast('关系链已达上限');
    return;
  }
  currentSteps.push(code);
  updateDisplay();
}

function undoStep() {
  if (currentSteps.length === 0) {
    toast('没有可撤销的步骤');
    return;
  }
  currentSteps.pop();
  updateDisplay();
}

function clearSteps() {
  currentSteps = [];
  updateDisplay();
}

function updateDisplay() {
  var chainEl = document.getElementById('displayChain');
  var resultEl = document.getElementById('displayResult');
  var noteEl = document.getElementById('displayNote');
  var tagsEl = document.getElementById('displayTags');

  // 渲染关系链
  if (currentSteps.length === 0) {
    chainEl.innerHTML = '';
  } else {
    chainEl.innerHTML = currentSteps.map(function(c){
      return '<span class="chip">' + (CODE_TO_CH[c] || c) + '</span>';
    }).join('<span style="color:#D4789B;margin:0 2px;">→</span>');
  }

  // 计算结果
  var result = calculate(currentSteps, 'male');

  resultEl.textContent = result.title || '？';
  noteEl.textContent = result.note || '';

  // 标签
  tagsEl.innerHTML = '';
  if (result.tags && result.tags.length > 0) {
    for (var i = 0; i < result.tags.length; i++) {
      var tag = document.createElement('span');
      tag.className = 'display-tag';
      tag.textContent = result.tags[i];
      tagsEl.appendChild(tag);
    }
  }
}

// 初始化
window.addEventListener('DOMContentLoaded', function(){
  currentSteps = [];
  updateDisplay();
});
</script>
