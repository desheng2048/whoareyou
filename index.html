        function backspace() {
            if (chain.length > 0) {
                chain.pop();
                updateDisplay();
            }
        }

        function clearAll() {
            chain = [];
            isReverse = false;
            updateDisplay();
        }

        function mutualCheck() {
            isReverse = !isReverse;
            updateDisplay();
        }

        function getRelationKey() {
            return chain.join(',');
        }

        function calculateRelation() {
            const key = getRelationKey();
            if (isReverse) {
                return reverseMap[key] || '关系太远啦';
            } else {
                return relationMap[key] || '关系太远啦';
            }
        }

        function updateDisplay() {
            const chainEl = document.getElementById('chain');
            const targetEl = document.getElementById('target');
            const labelEl = document.querySelector('.result .label');

            if (chain.length === 0) {
                chainEl.textContent = '我的';
            } else {
                chainEl.textContent = '我的' + chain.join('的');
            }

            const result = calculateRelation();
            targetEl.textContent = result;

            if (isReverse) {
                labelEl.textContent = 'Ta称呼我 ';
            } else {
                labelEl.textContent = '我称呼Ta ';
            }
        }
